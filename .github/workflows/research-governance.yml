name: Research governance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - 'docs/research/**'
      - 'docs/session/**'
      - 'AGENTS.md'
      - '.github/**'
      - 'prototype/**'
      - 'tools/**'
      - 'paper/**'
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: research-governance
  cancel-in-progress: false
jobs:
  preserve-and-link:
    if: github.repository == 'aloisiocosta-professor/trama-ide-web' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify artifacts and native sub-issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          assert repo == "aloisiocosta-professor/trama-ide-web"
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          pr = event["pull_request"]
          assert pr["head"]["repo"]["full_name"] == repo
          ref = pr["head"]["sha"]

          def api(path, data=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  data=None if data is None else json.dumps(data).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2026-03-10",
                      "Content-Type": "application/json",
                      "User-Agent": "research-governance",
                  },
                  method="GET" if data is None else "POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print("GitHub API failure:", error.code, path)
                  raise SystemExit(1) from None

          def content(path, commit_ref=ref):
              encoded = urllib.parse.quote(path, safe="/")
              item = api("/contents/" + encoded + "?ref=" + commit_ref)
              assert item["encoding"] == "base64"
              return base64.b64decode(item["content"])

          Path("tools").mkdir(exist_ok=True)
          for module in ("research_governance.py", "test_governance.py"):
              Path("tools", module).write_bytes(content("tools/" + module))
          sys.path.insert(0, "tools")
          from research_governance import validate_inventory, conventional
          import subprocess
          subprocess.run([sys.executable, "-m", "unittest", "-v", "test_governance"], cwd="tools", check=True)
          manifest = json.loads(content("docs/research/inventario.json"))
          commit = api("/git/commits/" + ref)
          tree = api("/git/trees/" + commit["tree"]["sha"] + "?recursive=1")
          assert not tree.get("truncated"), "Recursive tree truncated; paginate before verification."
          governed_count = validate_inventory([item["path"] for item in tree["tree"] if item["type"] == "blob"], manifest["files"])
          print("Inventory completeness verified:", governed_count)
          original_ref = "9d6b36ad85abbaf190ac7f49fd3b850ed820ea2c"
          protocol_path = "docs/research/Protocolo-UML-Java-v0.1.md"
          assert content(protocol_path) == content(protocol_path, original_ref), "Original protocol changed."
          print("Original protocol preserved against pinned commit:", original_ref)
          for item in manifest["files"]:
              actual = hashlib.sha256(content(item["path"])).hexdigest()
              assert actual == item["sha256"], "Hash mismatch: " + item["path"]
          print("Artifact hashes verified:", len(manifest["files"]))

          commits = api("/pulls/" + str(pr["number"]) + "/commits?per_page=100")
          assert len(commits) < 100, "Paginate commit validation before expanding this PR."
          for commit in commits:
              title = commit["commit"]["message"].splitlines()[0]
              assert conventional(title), title
          assert re.search(r"#(1|14)\b", pr.get("body") or ""), "PR must reference governance or parent issue."
          print("Conventional Commits verified:", len(commits))

          hierarchy = json.loads(content("docs/research/issue-hierarchy.json"))
          assert hierarchy["parent_issue"] == 1
          children = set(hierarchy["children"])
          assert children and all(isinstance(n, int) and n > 1 and n != pr["number"] for n in children)
          existing = api("/issues/1/sub_issues?per_page=100")
          linked = {item["number"] for item in existing}
          if children - linked and pr["head"]["ref"] != "docs/research-bootstrap":
              raise AssertionError("Missing native hierarchy; configure it through the bootstrap PR.")
          for number in sorted(children - linked):
              child = api("/issues/" + str(number))
              assert "pull_request" not in child
              api("/issues/1/sub_issues", {"sub_issue_id": child["id"]})
              print("Linked sub-issue:", number)
          verified = api("/issues/1/sub_issues?per_page=100")
          assert children.issubset({item["number"] for item in verified})
          for number in sorted(children):
              parent = api("/issues/" + str(number) + "/parent")
              assert parent["number"] == 1
              assert parent["repository_url"].endswith("/" + repo)
          print("Native issue hierarchy verified: parent #1; children:", sorted(children))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Artifact hashes and Conventional Commits verified.\n\n")
              summary.write("Native sub-issues verified under #1: " + str(sorted(children)) + ". No scientific step was closed.\n")
